<div class="container">

    <h1 class="text-center text-white mt-5 display-1"> Buscador de películas</h1>
    <hr class="text-white">

    <!-- nav -->
    <div class="mt-4 ">
        <header class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container px-0 px-xl-3">
                <form class=" " role="search">
                    <input id="inputTitle" class="form-control  p-3 fs-4" type="search" placeholder="Buscar por titulo" aria-label="Search" name="title" [(ngModel)]="title" #titulo (keyup)="searchMovie(title)" />

                </form>

                <ul class="navbar-nav  mb-2  ">

                    <li class="nav-item  ">
                        <a class="nav-link fs-1" (click)="rankingMovie()" role="button" aria-expanded="false"> Ranking  </a>


                </ul>

                <select class="bg-dark fs-1 text-light border-0 nav-link p-0" name="genre" [(ngModel)]="genre" (change)="searchGenre()">
                > 
                          <option value="">Genero</option>
                          <option value="accion">Accion</option>
                          <option value="aventura">Aventura</option>
                          <option value="terror">Terror</option>
                          <option value="animation">Animation</option>
                          <option value="crimen">Crimen</option>
                          <option value="comedia">Comedia</option>
                          <option value="drama">Drama</option>
                          >
                  </select>

            </div>
        </header>
    </div>

    <!-- Resultado de la busqueda -->

    <div *ngIf="movies.length > 0 ">

        <div class="mt-3">
            <span class="text-white fs-3">Ordenar por:</span>
            <button type="button" class="btn btn-secondary rounded-pill mx-3" #estreno value="estreno" (click)="sortBy(estreno.value)">Estreno</button>
            <button type="button" class="btn btn-secondary rounded-pill mx-3" #aZ value="aZ" (click)="sortBy(aZ.value)">Aa-Zz</button>
            <button type="button" class="btn btn-secondary rounded-pill mx-3" #zA value="zA" (click)="sortBy(zA.value)">Zz-aa</button>

        </div>
        <div class="row mt-5">
            <div class="col-4 mt-3" *ngFor="let item of movies  ">
                <div class="card gallery bg-dark" style="height: 650px">

                    <a class="gallery-item card-img-top" *ngIf="item.backdrop_path == null">

                        <img src='../../../assets/img/noImage.jpg' style="height:400px ;width: 100%" alt="Movie image">
                    </a>
                    <a class="gallery-item card-img-top">

                        <img [src]="'https://image.tmdb.org/t/p/w500/'+ item.backdrop_path" style="height:400px ;width: 100%" alt="Movie image">
                    </a>

                    <div class="card-body ">

                        <h5 class=" text-warning">{{item.original_title }}
                        </h5>
                        <p class="text-white">{{item.release_date |date}} </p>
                        <!-- <p class="text-white">{{item.Genre}} </p> -->
                        <span class="text-white fs-4">Ave:
                            {{item.vote_average }}
                            <img style="height: 30px"  src="../../../assets/img/star.png"  alt="">
                        </span>

                        <div class="d-grid gap-2 mt-4">
                            <a class="btn btn-sm btn-primary " [routerLink]="['/detail', item.id ]" href="#">Ver detalles</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
    <div class="" *ngIf="movies.length==0 && title ">
        <h3 class="text-warning text-center">No hay peliculas</h3>
    </div>





</div>
